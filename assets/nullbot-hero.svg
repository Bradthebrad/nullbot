<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">NullBot hero banner</title>
  <desc id="desc">A retro terminal interface banner for NullBot with output and activity panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071214"/>
      <stop offset="0.48" stop-color="#0d1b20"/>
      <stop offset="1" stop-color="#15110b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe033"/>
      <stop offset="0.58" stop-color="#ffc400"/>
      <stop offset="1" stop-color="#c6751b"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 5h6" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="520" fill="url(#bg)"/>
  <rect width="1280" height="520" fill="url(#scan)"/>
  <g opacity="0.34">
    <circle cx="1060" cy="80" r="170" fill="#ffd300"/>
    <circle cx="220" cy="460" r="210" fill="#2e7d78"/>
  </g>
  <g transform="translate(80 54)" font-family="Consolas, 'Courier New', monospace">
    <text x="6" y="94" font-size="88" font-weight="900" fill="#7b4713" opacity="0.95">NULLBOT</text>
    <text x="0" y="82" font-size="88" font-weight="900" fill="url(#gold)" filter="url(#softGlow)">NULLBOT</text>
    <text x="6" y="126" font-size="24" fill="#9dd9d2" font-weight="700">It's just a client - no magic here.</text>
  </g>
  <g transform="translate(70 180)">
    <rect x="0" y="0" width="760" height="260" rx="18" fill="#081113" stroke="#2e7d78" stroke-width="4"/>
    <rect x="790" y="0" width="420" height="260" rx="18" fill="#11191d" stroke="#d9b44a" stroke-width="4"/>
    <text x="22" y="34" font-size="22" fill="#f4d35e" font-family="Consolas, 'Courier New', monospace" font-weight="700">Output</text>
    <text x="812" y="34" font-size="22" fill="#f4d35e" font-family="Consolas, 'Courier New', monospace" font-weight="700">Activity Panel</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="22">
      <text x="28" y="82" fill="#9dd9d2" font-weight="700">ASSISTANT</text>
      <text x="28" y="118" fill="#e8f1f2">Rendered markdown, skills, MCP tools, history, logs.</text>
      <text x="28" y="158" fill="#ffd300">USER</text>
      <text x="28" y="194" fill="#e8f1f2">/models</text>
      <text x="28" y="232" fill="#9dd9d2" font-weight="700">ASSISTANT</text>
      <text x="160" y="232" fill="#e8f1f2">Models panel opened.</text>
    </g>
    <g font-family="Consolas, 'Courier New', monospace" font-size="20">
      <text x="812" y="82" fill="#f05b5b">13:20:09</text>
      <text x="912" y="82" fill="#e8f1f2">agent model start</text>
      <text x="812" y="118" fill="#f05b5b">13:20:15</text>
      <text x="912" y="118" fill="#e8f1f2">skills_list tool done</text>
      <text x="812" y="154" fill="#f05b5b">13:20:16</text>
      <text x="912" y="154" fill="#e8f1f2">logs_recent tool done</text>
      <text x="812" y="190" fill="#f05b5b">13:20:17</text>
      <text x="912" y="190" fill="#e8f1f2">model done</text>
    </g>
  </g>
  <rect x="70" y="458" width="1210" height="34" rx="8" fill="#9dd9d2"/>
  <text x="92" y="481" fill="#102a2a" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="800">openai | gpt-5.4-nano | F1 /help | Ctrl+O activity | ready</text>
</svg>
